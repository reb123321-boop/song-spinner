<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Spinner 🎵</title>
  <style>
    :root {
      --bg1: #1f2937;
      --bg2: #020617;
      --text: #f9fafb;
      --muted: rgba(255,255,255,0.75);
      --pointer: #facc15;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    #app {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    h1 {
      margin: 0.25rem 0 0.25rem;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      text-align: center;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 55%, #9ca3af 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.25),
        0 2px 0 rgba(0,0,0,0.15),
        0 4px 8px rgba(0,0,0,0.45);
    }

    #status {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 1.25rem;
    }

    #statusDot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.35);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
    }

    .pointer {
      position: absolute;
      top: -16px; /* overlaps wheel but clears title */
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 44px solid var(--pointer);
      z-index: 5;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
    }

    #wheelWrap {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: min(95vw, 1100px);
      margin-top: 1.25rem;
      margin-bottom: 1.25rem;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,0.55));
    }

    /* soft ambient shadow below wheel to enhance floating illusion */
    #wheelWrap::before {
      content: '';
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      bottom: 6%;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.25) 35%,
        rgba(0,0,0,0.12) 55%,
        rgba(0,0,0,0.05) 65%,
        rgba(0,0,0,0.0) 72%
      );
      filter: blur(22px);
      z-index: 0;
    }

    canvas {
      position: relative;
      z-index: 2;
      display: block;
      background: #fff;
      border-radius: 50%;
      box-shadow:
        0 8px 12px rgba(255,255,255,0.25) inset,
        0 -10px 18px rgba(0,0,0,0.45) inset,
        0 28px 48px rgba(0,0,0,0.55);
    }

    #overlayResult {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
    }

    #overlayCard {
      background: rgba(2,6,23,0.85);
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      font-size: clamp(1.15rem, 3vw, 2.4rem);
      font-weight: 900;
      text-align: center;
      max-width: min(90%, 900px);
      line-height: 1.15;
    }

    #controls {
      width: 100%;
      padding: 0.5rem 0 0.75rem;
      display: flex;
      justify-content: center;
      position: sticky;
      bottom: 0;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a { text-decoration: none; }

    button, .btn-link {
      position: relative;
      padding: 0.75rem 1.7rem;
      font-size: 1.05rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
      box-shadow:
        0 3px 0 rgba(255,255,255,0.45) inset,
        0 -4px 0 rgba(0,0,0,0.35) inset,
        0 10px 18px rgba(0,0,0,0.55);
      text-shadow:
        0 1px 0 rgba(0,0,0,0.45),
        0 -1px 0 rgba(255,255,255,0.35);
    }

    button {
      background: linear-gradient(180deg, #34d399 0%, #22c55e 55%, #16a34a 100%);
    }

    .btn-link {
      background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 55%, #0ea5e9 100%);
    }

    button:hover, .btn-link:hover {
      filter: brightness(1.18) saturate(1.1);
    }

    #toggleListBtn {
      background: linear-gradient(180deg, #c4b5fd 0%, #a78bfa 55%, #7c3aed 100%);
    }

    #deselectLastBtn {
      background: linear-gradient(180deg, #fca5a5 0%, #ef4444 55%, #b91c1c 100%);
    }

    #deselectLastBtn:hover {
      filter: brightness(1.15) saturate(1.1);
    }

    button:active, .btn-link:active {
      transform: translateY(4px) scale(0.98);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -1px 0 rgba(0,0,0,0.45) inset,
        0 4px 6px rgba(0,0,0,0.6);
      text-shadow:
        0 -1px 0 rgba(0,0,0,0.55),
        0 1px 0 rgba(255,255,255,0.25);
    }

    #listOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.85);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    #listPanel {
      background: #020617;
      padding: 1rem;
      border-radius: 14px;
      width: min(720px, 100%);
      max-height: 85vh;
      overflow: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    #songChecklist label {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .25rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      user-select: none;
    }

    #songChecklist input[type="checkbox"] {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>🎶 Song Spinner</h1>
    <div id="status"><span id="statusDot"></span><span id="statusText">Loading songs…</span></div>

    <div id="wheelWrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel"></canvas>
      <div id="overlayResult"><div id="overlayCard"><span id="overlayText"></span></div></div>
    </div>

    <div id="controls">
      <div class="row">
        <a class="btn-link" href="https://docs.google.com/spreadsheets/d/16piXDxJk6q6Il0mPR4phsyfXML6CkWyJyS7LGEM_Zaw/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Edit List</a>
        <button id="toggleListBtn" type="button">Toggle Songs</button>
        <button id="spinBtn" type="button">SPIN</button>
        <button id="deselectLastBtn" type="button">Remove Last Song</button>
      </div>
    </div>
  </div>

  <div id="listOverlay" role="dialog" aria-modal="true" aria-label="Song visibility">
    <div id="listPanel">
      <h2 style="margin:0 0 .6rem;">Song Visibility</h2>
      <div id="songChecklist"></div>
      <div style="display:flex; gap:.5rem; justify-content:flex-end; margin-top:.75rem; position: sticky; bottom: 0; background: #020617; padding-top: .5rem;">
        <button id="selectAllBtn" type="button">Select All</button>
        <button id="selectNoneBtn" type="button">Select None</button>
        <button id="closeListBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlayResult');
    const overlayText = document.getElementById('overlayText');
    const listOverlay = document.getElementById('listOverlay');
    const songChecklist = document.getElementById('songChecklist');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const SHEET_ID = '16piXDxJk6q6Il0mPR4phsyfXML6CkWyJyS7LGEM_Zaw';
    const SHEET_TAB = 'Songs';

    // Real wood textures (Level 1 veneer look).
    // Put these images in your GitHub Pages repo under /textures/...
    const woodTextures = [
      // rotation is in radians and controls grain direction per wood
      // 0 = along slice, Math.PI/2 = across slice
      { name: 'oak', src: 'textures/oak.jpg', rotate: 0 },
      { name: 'walnut', src: 'textures/walnut.jpg', rotate: 0 },
      { name: 'maple', src: 'textures/maple.jpg', rotate: Math.PI / 2 },
      { name: 'cherry', src: 'textures/cherry.jpg', rotate: 0 },
      { name: 'mahogany', src: 'textures/mahogany.jpg', rotate: 0 }
    ];

    // Wheel state
    let songs = []; // [{ id, title, artist, display }]
    let songVisibility = {}; // { [id]: boolean }
    let rotation = 0;
    let spinning = false;
    let lastSpunId = null;
    let didInitRotation = false; // align first song at 12 o'clock once per page load

    // wood texture patterns
    const woodPatterns = []; // CanvasPattern objects (same order as woodTextures)
    let woodReady = false;

    const CACHE_KEY = `songspinner_cache_${SHEET_ID}_${SHEET_TAB}`;

    function setStatus(kind, msg) {
      const colour = kind === 'ok' ? 'var(--ok)' : kind === 'warn' ? 'var(--warn)' : kind === 'bad' ? 'var(--bad)' : 'rgba(255,255,255,0.35)';
      statusDot.style.background = colour;
      statusText.textContent = msg;
    }

    function loadWoodTextures() {
      woodReady = false;
      woodPatterns.length = 0;

      return Promise.all(
        woodTextures.map(w => new Promise((resolve) => {
          const img = new Image();
          img.src = w.src;
          img.onload = () => {
            const p = ctx.createPattern(img, 'repeat');
            if (p) woodPatterns.push(p);
            resolve();
          };
          img.onerror = () => {
            console.warn(`Failed to load texture: ${w.src}`);
            resolve();
          };
        }))
      ).then(() => {
        woodReady = woodPatterns.length > 0;
      });
    }

    function parseSongCell(raw) {
      const s = String(raw ?? '').replace(/^"|"$/g, '').trim();
      if (!s) return null;
      const parts = s.split(' - ');
      const title = (parts[0] || '').trim();
      const artist = parts.slice(1).join(' - ').trim();
      return { title, artist };
    }

    function visibleSongs() {
      return songs.filter(s => songVisibility[s.id] !== false);
    }

    // Robust-ish CSV parsing (handles commas inside quotes)
    function parseCSVLine(line) {
      const out = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          out.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }

      out.push(cur);
      return out.map(s => s.trim());
    }

    function parseCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
      return lines.map(parseCSVLine);
    }

    function includeToChecked(raw) {
      const v = String(raw ?? '').replace(/^"|"$/g, '').trim();
      return !/^false|no|0$/i.test(v);
    }

    function ensureSquareCanvasToWrapper() {
      const wrap = document.getElementById('wheelWrap');
      const rect = wrap.getBoundingClientRect();
      const cssSize = Math.max(240, Math.min(rect.width, rect.height) - 12);

      const dpr = window.devicePixelRatio || 1;
      const px = Math.floor(cssSize * dpr);

      if (
        canvas.width !== px ||
        canvas.height !== px ||
        canvas.style.width !== `${cssSize}px` ||
        canvas.style.height !== `${cssSize}px`
      ) {
        canvas.width = px;
        canvas.height = px;
        canvas.style.width = `${cssSize}px`;
        canvas.style.height = `${cssSize}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      return { cssSize, r: cssSize / 2 };
    }

    function drawWheel() {
      const { cssSize, r } = ensureSquareCanvasToWrapper();
      const cx = r;
      const cy = r;

      ctx.clearRect(0, 0, cssSize, cssSize);

      const vs = visibleSongs();
      if (!vs.length) return;

      const arc = (2 * Math.PI) / vs.length;
      if (!woodReady) return;

      // outer rim bevel
      const rimGrad = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
      rimGrad.addColorStop(0, 'rgba(255,255,255,0.0)');
      rimGrad.addColorStop(0.6, 'rgba(255,255,255,0.35)');
      rimGrad.addColorStop(0.85, 'rgba(255,255,255,0.65)');
      rimGrad.addColorStop(1, 'rgba(255,255,255,0.9)');

      vs.forEach((s, i) => {
        const a = i * arc + rotation;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, a, a + arc);
        ctx.closePath();

        const pat = woodPatterns[i % woodPatterns.length];
        const texCfg = woodTextures[i % woodTextures.length];

        if (pat) {
          ctx.save();
          ctx.clip();

          ctx.translate(cx, cy);
          ctx.rotate(a + (texCfg?.rotate || 0));

          const veneerScale = 0.85; // grain density
          ctx.scale(veneerScale, veneerScale);

          ctx.fillStyle = pat;
          ctx.fillRect(-r, -r, r * 2, r * 2);

          // subtle depth, no glare
          const shade = ctx.createRadialGradient(0, 0, r * 0.28, 0, 0, r);
          shade.addColorStop(0, 'rgba(255,255,255,0.03)');
          shade.addColorStop(0.7, 'rgba(0,0,0,0.00)');
          shade.addColorStop(1, 'rgba(0,0,0,0.20)');
          ctx.fillStyle = shade;
          ctx.fillRect(-r, -r, r * 2, r * 2);

          ctx.restore();
        }

        // text
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a + arc / 2);
        ctx.textAlign = 'right';

        const fontSize = Math.max(12, r * 0.05);
        ctx.font = `900 ${fontSize}px system-ui, sans-serif`;

        // carved/embossed text
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillText(s.display, r * 0.9, 1.5);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText(s.display, r * 0.9, 0);

        ctx.restore();
      });

      // rim highlight
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.985, 0, Math.PI * 2);
      ctx.strokeStyle = rimGrad;
      ctx.lineWidth = r * 0.03;
      ctx.stroke();

      // hub
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.045, 0, Math.PI * 2);
      const hubGrad = ctx.createRadialGradient(cx, cy, r * 0.005, cx, cy, r * 0.05);
      hubGrad.addColorStop(0, '#d1d5db');
      hubGrad.addColorStop(1, '#6b7280');
      ctx.fillStyle = hubGrad;
      ctx.fill();
    }

    function pickIndexForRotation(len) {
      return Math.floor(((2 * Math.PI - (rotation + Math.PI / 2)) % (2 * Math.PI)) / ((2 * Math.PI) / len));
    }

    function spin() {
      const vsNow = visibleSongs();
      if (spinning || vsNow.length === 0) return;

      spinning = true;
      overlay.style.display = 'none';

      const extra = (4 + Math.random() * 3) * 2 * Math.PI;
      const target = Math.random() * 2 * Math.PI;
      const start = performance.now();
      const dur = 3000;
      const startRot = rotation;

      (function anim(t) {
        const p = Math.min((t - start) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);
        rotation = startRot + (extra + target) * e;
        drawWheel();

        if (p < 1) {
          requestAnimationFrame(anim);
        } else {
          spinning = false;
          const vs = visibleSongs();
          if (!vs.length) return;

          const idx = pickIndexForRotation(vs.length);
          const picked = vs[(idx + vs.length) % vs.length];

          lastSpunId = picked.id;
          overlayText.textContent = picked.display;
          overlay.style.display = 'flex';
        }
      })(start);
    }

    function rebuildChecklist() {
      songChecklist.innerHTML = '';
      songs.forEach(s => {
        const l = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = songVisibility[s.id] !== false;
        cb.onchange = () => {
          songVisibility[s.id] = cb.checked;
          overlay.style.display = 'none';
          drawWheel();
        };
        l.appendChild(cb);
        l.appendChild(document.createTextNode(s.display));
        songChecklist.appendChild(l);
      });
    }

    function initRotationOnce() {
      if (didInitRotation) return;
      const vs = visibleSongs();
      if (!vs.length) return;
      const arc = (2 * Math.PI) / vs.length;
      rotation = -Math.PI / 2 - arc / 2;
      didInitRotation = true;
    }

    // --- Sheet loading ---
    function buildCsvUrls() {
      // IMPORTANT:
      // To avoid OS / browser network permission loops and Google auth prompts,
      // we ONLY use the published CSV endpoint.
      // The sheet must be published: File → Share → Publish to web → Sheet: Songs → CSV

      const publishedCsvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/pub?output=csv&sheet=${encodeURIComponent(SHEET_TAB)}`;
      return [publishedCsvUrl];
    }

    async function fetchWithFallback(urls) {
      let lastErr = null;
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: 'no-store', credentials: 'omit' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.text();
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('Failed to fetch');
    }

    function applySongsFromCsv(csv, sourceLabel) {
      const rows = parseCSV(csv);
      if (rows.length === 0) throw new Error('Sheet returned empty CSV');

      const headers = rows[0].map(h => h.trim());
      const songIdx = headers.findIndex(h => /song/i.test(h));
      const incIdx = headers.findIndex(h => /include/i.test(h));
      if (songIdx < 0) throw new Error('Could not find a "Song" column in the sheet');

      const temp = [];
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i];
        const meta = parseSongCell(cols[songIdx]);
        if (!meta) continue;
        const id = `${meta.title}__${meta.artist}__${i}`;
        const incRaw = incIdx >= 0 ? cols[incIdx] : 'TRUE';
        temp.push({ id, title: meta.title, artist: meta.artist, include: includeToChecked(incRaw) });
      }

      // Determine which titles are ambiguous
      const titleCounts = {};
      temp.forEach(s => { titleCounts[s.title] = (titleCounts[s.title] || 0) + 1; });

      songs = [];
      songVisibility = {};

      temp.forEach(s => {
        const ambiguous = titleCounts[s.title] > 1;
        const display = ambiguous && s.artist ? `${s.title} – ${s.artist}` : s.title;
        songs.push({ id: s.id, title: s.title, artist: s.artist, display });
        songVisibility[s.id] = s.include;
      });

      rebuildChecklist();
      initRotationOnce();
      drawWheel();

      // cache last-good CSV so the app still works if fetch fails later
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), csv }));
      } catch (_) {}

      setStatus('ok', `Loaded ${songs.length} songs from Google Sheet (${sourceLabel}).`);
    }

    function applyFallbackSongs(reason) {
      const fallback = [
        { title: 'A Good Heart', artist: '' },
        { title: 'Fix You', artist: 'Coldplay' },
        { title: 'Yesterday', artist: '' },
        { title: 'Stand By Me', artist: '' },
        { title: 'I’m Gonna Be (500 Miles)', artist: '' }
      ];

      songs = fallback.map((s, idx) => ({
        id: `${s.title}__${s.artist}__fallback__${idx}`,
        title: s.title,
        artist: s.artist,
        display: s.artist ? `${s.title} – ${s.artist}` : s.title
      }));

      songVisibility = {};
      songs.forEach(s => { songVisibility[s.id] = true; });

      rebuildChecklist();
      initRotationOnce();
      drawWheel();

      setStatus('warn', `Could not load Google Sheet (${reason}). Using a small fallback list.`);
    }

    async function loadSongs() {
      setStatus('', 'Loading songs…');

      // Try live sheet
      try {
        const urls = buildCsvUrls();
        const csv = await fetchWithFallback(urls);
        applySongsFromCsv(csv, 'live');
        return;
      } catch (e) {
        console.warn('Live sheet fetch failed:', e);
      }

      // Try cache
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
        if (cached && typeof cached.csv === 'string' && cached.csv.trim()) {
          applySongsFromCsv(cached.csv, 'cached');
          setStatus('warn', 'Using cached song list (live fetch failed).');
          return;
        }
      } catch (_) {}

      // Fallback
      applyFallbackSongs('fetch failed');
    }

    // UI
    document.getElementById('spinBtn').onclick = spin;
    document.getElementById('toggleListBtn').onclick = () => { listOverlay.style.display = 'flex'; };
    document.getElementById('closeListBtn').onclick = () => { listOverlay.style.display = 'none'; };

    document.getElementById('selectAllBtn').onclick = () => {
      songs.forEach(s => { songVisibility[s.id] = true; });
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    document.getElementById('selectNoneBtn').onclick = () => {
      songs.forEach(s => { songVisibility[s.id] = false; });
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    document.getElementById('deselectLastBtn').onclick = () => {
      if (!lastSpunId) return;
      songVisibility[lastSpunId] = false;
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    // --- Tests (run in console) ---
    function runTests() {
      const saved = {
        songs: songs.slice(),
        songVisibility: { ...songVisibility },
        rotation,
        didInitRotation,
        lastSpunId,
        woodReady
      };

      const assert = (cond, msg) => { if (!cond) throw new Error(`Test failed: ${msg}`); };

      try {
        assert(Array.isArray(woodTextures) && woodTextures.length >= 3, 'woodTextures is defined');

        const urls = buildCsvUrls();
        assert(urls.length === 1 && urls[0].includes('/pub?output=csv'), 'Published CSV URL is built (single URL)');

        const p1 = parseSongCell('Fix You - Coldplay');
        assert(p1 && p1.title === 'Fix You' && p1.artist === 'Coldplay', 'parseSongCell splits Title - Artist');

        const rows = parseCSV('Song,Include\n"Hello, World - Someone",TRUE\n');
        assert(rows.length === 2 && rows[1][0] === 'Hello, World - Someone', 'parseCSV handles commas inside quotes');

        assert(includeToChecked('FALSE') === false, 'Include FALSE => unchecked');
        assert(includeToChecked('TRUE') === true, 'Include TRUE => checked');

        const minimal = 'Song,Include\nA,TRUE\nB,FALSE\n';
        applySongsFromCsv(minimal, 'test');
        assert(songs.length === 2, 'applySongsFromCsv loads rows');
        assert(visibleSongs().length === 1, 'Include column respected');

        console.info('Song Spinner tests: OK');
      } finally {
        songs = saved.songs;
        songVisibility = saved.songVisibility;
        rotation = saved.rotation;
        didInitRotation = saved.didInitRotation;
        lastSpunId = saved.lastSpunId;
        woodReady = saved.woodReady;
      }
    }

    // Boot
    loadWoodTextures().then(() => {
      if (!woodReady) {
        setStatus('warn', 'Wood textures missing. Add /textures/*.jpg to your GitHub Pages repo.');
      }
      drawWheel();
    });

    loadSongs().catch(err => {
      console.error(err);
      setStatus('bad', `Song load failed: ${String(err?.message || err)}`);
      drawWheel();
    });

    window.addEventListener('resize', () => {
      overlay.style.display = 'none';
      drawWheel();
    });

    runTests();
  </script>
</body>
</html>
