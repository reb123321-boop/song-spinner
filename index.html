<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Song Spinner 🎵</title>
  <style>
    :root {
      --bg1: #1f2937;
      --bg2: #020617;
      --text: #f9fafb;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color: var(--text);
      margin: 0;
      padding: 0;
    }

    #app {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    #titleBar {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin: 0.25rem 0 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 55%, #9ca3af 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.25),
        0 2px 0 rgba(0,0,0,0.15),
        0 4px 8px rgba(0,0,0,0.45);
    }

    #buildStamp {
      position: static;
      font-size: 0.7rem;
      opacity: 0.55;
      letter-spacing: 0.03em;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 520px) {
      #titleBar { gap: 0.4rem; }
      #buildStamp { font-size: 0.65rem; opacity: 0.45; }
    }

    .pointer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 0%;
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-top: 62px solid #d4af37; /* brass */
      z-index: 5;
      filter:
        drop-shadow(0 8px 10px rgba(0,0,0,0.55))
        drop-shadow(0 3px 0 rgba(255,255,255,0.35));
      transition: transform 0.06s ease-out;
    }

    .pointer::after {
      content: '';
      position: absolute;
      left: -12px;
      top: -52px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #f7e6a3 0%, #e6c45a 40%, #caa23a 70%, #7a5a18 100%);
      box-shadow:
        0 3px 6px rgba(0,0,0,0.45),
        inset 0 1px 2px rgba(255,255,255,0.45),
        inset 0 -2px 3px rgba(0,0,0,0.35);
    }

    #wheelWrap {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: min(95vw, 1100px);
      margin-top: 1.5rem;
      margin-bottom: 1.25rem;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: none;
    }

    @media (min-width: 700px) {
      #wheelWrap { margin-top: 3.5rem; }
    }

    #wheelWrap::before {
      content: '';
      position: absolute;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      bottom: 6%;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.45) 0%,
        rgba(0,0,0,0.25) 35%,
        rgba(0,0,0,0.12) 55%,
        rgba(0,0,0,0.05) 65%,
        rgba(0,0,0,0.0) 72%
      );
      filter: blur(22px);
      z-index: 0;
    }

    canvas {
      cursor: pointer;
      position: relative;
      z-index: 2;
      display: block;
      background: transparent;
      border-radius: 50%;
      box-shadow: 0 28px 48px rgba(0,0,0,0.55);
    }

    #overlayResult {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
    }

    #overlayCard {
      background: linear-gradient(180deg, rgba(18,18,18,0.9), rgba(2,6,23,0.96));
      padding: 1.2rem 1.8rem;
      border-radius: 20px;
      font-size: clamp(1.4rem, 3.4vw, 2.8rem);
      font-weight: 900;
      text-align: center;
      max-width: min(90%, 900px);
      line-height: 1.15;
      letter-spacing: 0.05em;
      color: #f9fafb;
      border: 2px solid rgba(212,175,55,0.9);
      text-shadow:
        0 1px 0 rgba(255,255,255,0.45),
        0 4px 10px rgba(0,0,0,0.65);
      box-shadow:
        0 2px 0 rgba(255,255,255,0.45) inset,
        0 -4px 8px rgba(0,0,0,0.6) inset,
        0 26px 55px rgba(0,0,0,0.75);
      transform: scale(0.7) translateY(18px);
      opacity: 0;
      animation: popIn 420ms cubic-bezier(.18,1.3,.4,1) forwards,
                 glowPulse 700ms ease-out 380ms;
    }

    @keyframes glowPulse {
      0%   { box-shadow: 0 0 0 rgba(212,175,55,0); }
      40%  { box-shadow: 0 0 26px rgba(212,175,55,0.55); }
      100% { box-shadow: 0 0 0 rgba(212,175,55,0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.75) translateY(14px); opacity: 0; }
      60% { transform: scale(1.08) translateY(-4px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    #controls {
      width: 100%;
      padding: 0.5rem 0 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      align-items: center;
      justify-content: center;
      position: sticky;
      bottom: 0;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a { text-decoration: none; }

    button, .btn-link {
      position: relative;
      padding: 0.75rem 1.7rem;
      font-size: 1.05rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      color: rgba(255,255,255,0.85);
      transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
      box-shadow:
        0 3px 0 rgba(255,255,255,0.45) inset,
        0 -4px 0 rgba(0,0,0,0.35) inset,
        0 10px 18px rgba(0,0,0,0.55);
      text-shadow:
        0 1px 0 rgba(0,0,0,0.45),
        0 -1px 0 rgba(255,255,255,0.35);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { background: linear-gradient(180deg, #34d399 0%, #22c55e 55%, #16a34a 100%); }
    .btn-link { background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 55%, #0ea5e9 100%); }
    button:hover, .btn-link:hover { filter: brightness(1.12) saturate(1.05); }

    #toggleListBtn { background: linear-gradient(180deg, #c4b5fd 0%, #a78bfa 55%, #7c3aed 100%); }
    #deselectLastBtn { background: linear-gradient(180deg, #fca5a5 0%, #ef4444 55%, #b91c1c 100%); }
    #spotifyBtn { background: linear-gradient(180deg, #86efac 0%, #22c55e 55%, #15803d 100%); }
    #lyricsBtn { background: linear-gradient(180deg, #8ab4f8 0%, #4285f4 55%, #1a73e8 100%); }
    #editMasterListBtn { background: linear-gradient(180deg, #34d399 0%, #22c55e 55%, #16a34a 100%); }
    #spotifyBtn:hover { filter: brightness(1.15) saturate(1.1); }
    #deselectLastBtn:hover { filter: brightness(1.15) saturate(1.1); }

    #wheelNarrowBtn, #wheelWideBtn, #wheelResetBtn {
      font-size: 0.95rem;
      opacity: 0.9;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 55%, #020617 100%);
      box-shadow:
        0 2px 0 rgba(255,255,255,0.12) inset,
        0 -3px 0 rgba(0,0,0,0.55) inset,
        0 8px 14px rgba(0,0,0,0.6);
    }

    button:active, .btn-link:active {
      transform: translateY(4px) scale(0.98);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 -1px 0 rgba(0,0,0,0.45) inset,
        0 4px 6px rgba(0,0,0,0.6);
    }

    #listOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.85);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* Panel is a column layout: checklist scrolls, buttons sit below */
    #listPanel {
      background: #020617;
      padding: 1rem;
      border-radius: 14px;
      width: min(720px, 100%);
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    #songChecklist {
      flex: 1;
      overflow-y: auto;
      margin-bottom: .75rem;
      padding-right: .25rem;
    }

    #songChecklist label {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .35rem .25rem;
      border-bottom: 1px solid rgba(255,255,255,.08);
      user-select: none;
      line-height: 1.25;
    }

    #songChecklist input[type="checkbox"] { transform: scale(1.1); }
  </style>
</head>
<body>
  <div id="app">
    <div id="titleBar">
      <h1>🎶 Song Spinner</h1>
      <span id="buildStamp"></span>
    </div>

    <div id="wheelWrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel"></canvas>
      <div id="overlayResult"><div id="overlayCard"><span id="overlayText"></span></div></div>
    </div>

    <div id="controls">
      <div class="row" aria-label="Wheel aspect compensation">
        <button id="wheelNarrowBtn" type="button" title="Narrow wheel">−</button>
        <button id="wheelResetBtn" type="button" title="Reset wheel to circle">Reset</button>
        <button id="wheelWideBtn" type="button" title="Widen wheel">+</button>
      </div>
      <div class="row">
        <a class="btn-link" id="editMasterListBtn" href="https://docs.google.com/spreadsheets/d/16piXDxJk6q6Il0mPR4phsyfXML6CkWyJyS7LGEM_Zaw/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Edit Master List</a>
        <button id="toggleListBtn" type="button">Toggle Songs</button>
        <!-- SPIN button removed: wheel itself is the spin control -->
        <button id="lyricsBtn" type="button">Open Lyrics</button>
        <button id="spotifyBtn" type="button">Open in Spotify</button>
        <button id="deselectLastBtn" type="button">Remove Last Song</button>
      </div>
    </div>
  </div>

  <div id="listOverlay" role="dialog" aria-modal="true" aria-label="Song visibility">
    <div id="listPanel">
      <h2 style="margin:0 0 .6rem;">Song Visibility</h2>
      <div id="songChecklist"></div>
      <div id="listButtons" style="display:flex; gap:.5rem; justify-content:flex-end; background:#020617; padding-top:.5rem;">
        <button id="selectAllBtn" type="button">Select All</button>
        <button id="selectNoneBtn" type="button">Select None</button>
        <button id="closeListBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlayResult');
    const overlayText = document.getElementById('overlayText');
    const listOverlay = document.getElementById('listOverlay');
    const songChecklist = document.getElementById('songChecklist');

    // Build info derived from deployed file timestamp (GitHub Pages friendly)
    const buildStampEl = document.getElementById('buildStamp');
    if (buildStampEl) {
      const deployedAt = new Date(document.lastModified);
      buildStampEl.textContent = `Updated ${deployedAt.toLocaleString()}`;
    }

    // Real wood textures (Level 1 veneer look).
    // Put these images in your GitHub Pages repo under /textures/...
    const woodTextures = [
      { name: 'oak', src: 'textures/oak.jpg', rotate: 0 },
      { name: 'walnut', src: 'textures/walnut.jpg', rotate: 0 },
      { name: 'maple', src: 'textures/maple.jpg', rotate: Math.PI / 2 },
      { name: 'cherry', src: 'textures/cherry.jpg', rotate: 0 },
      { name: 'mahogany', src: 'textures/mahogany.jpg', rotate: 0 }
    ];

    // Wheel state
    let songs = []; // [{ id, title, artist, display, key?, lyricsUrl? }]
    let songVisibility = {}; // { [id]: boolean }
    let rotation = 0;
    let spinning = false;
    let lastSpunId = null;
    let didInitRotation = false; // align first song at 12 o'clock once per page load

    // Horizontal scale factor to compensate for projector aspect distortion
    let wheelScaleX = 1.0; // 1.0 = perfect circle (CSS-scale applied to whole wheel)

    // --- spinner sound + pointer flex ---
    const clickAudio = new Audio('sounds/click.mp3');
    const winAudio = new Audio('sounds/win.mp3');
    clickAudio.volume = 0.5;
    winAudio.volume = 0.6;

    const pointerEl = document.querySelector('.pointer');
    const POINTER_TRIANGLE_HEIGHT = 62; // matches CSS border-top

    let lastClickIndex = null;

    // wood texture patterns (index-aligned with woodTextures)
    const woodImages = new Array(woodTextures.length).fill(null);
    const woodPatterns = new Array(woodTextures.length).fill(null);
    let woodReady = false;

    function parseSongCell(raw) {
      const s = String(raw ?? '').replace(/^"|"$/g, '').trim();
      if (!s) return null;
      const parts = s.split(' - ');
      const title = (parts[0] || '').trim();
      const artist = parts.slice(1).join(' - ').trim();
      return { title, artist, display: title };
    }

    function visibleSongs() {
      return songs.filter(s => songVisibility[s.id] !== false);
    }

    // Robust-ish CSV parsing (handles commas inside quotes)
    function parseCSVLine(line) {
      const out = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          out.push(cur);
          cur = '';
        } else {
          cur += ch;
        }
      }

      out.push(cur);
      return out.map(s => s.trim());
    }

    function parseCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
      return lines.map(parseCSVLine);
    }

    function includeToChecked(raw) {
      const v = String(raw ?? '').replace(/^"|"$/g, '').trim();
      return !/^false|no|0$/i.test(v);
    }

    function ensureSquareCanvasToWrapper() {
      const wrap = document.getElementById('wheelWrap');
      const rect = wrap.getBoundingClientRect();
      const cssSize = Math.max(240, Math.min(rect.width, rect.height) - 12);

      const dpr = window.devicePixelRatio || 1;
      const px = Math.floor(cssSize * dpr);

      if (
        canvas.width !== px ||
        canvas.height !== px ||
        canvas.style.width !== `${cssSize}px` ||
        canvas.style.height !== `${cssSize}px`
      ) {
        canvas.width = px;
        canvas.height = px;
        canvas.style.width = `${cssSize}px`;
        canvas.style.height = `${cssSize}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      return { cssSize, r: cssSize / 2 };
    }

    function positionPointer(rimWidthPx) {
      if (!pointerEl) return;
      const wrap = document.getElementById('wheelWrap');
      const canvasRect = canvas.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();

      // We want the TIP to sit just inside the rim (between the pins)
      const tipInset = rimWidthPx * 0.55;
      const top = (canvasRect.top - wrapRect.top) - POINTER_TRIANGLE_HEIGHT + tipInset;
      pointerEl.style.top = `${top}px`;
    }

    function loadWoodTextures() {
      woodReady = false;
      for (let i = 0; i < woodImages.length; i++) woodImages[i] = null;
      for (let i = 0; i < woodPatterns.length; i++) woodPatterns[i] = null;

      return Promise.all(
        woodTextures.map((w, idx) => new Promise((resolve) => {
          const img = new Image();
          img.src = w.src;
          img.onload = () => {
            woodImages[idx] = img;
            const p = ctx.createPattern(img, 'repeat');
            woodPatterns[idx] = p || null;
            resolve();
          };
          img.onerror = () => {
            console.warn(`Failed to load texture: ${w.src}`);
            woodImages[idx] = null;
            woodPatterns[idx] = null;
            resolve();
          };
        }))
      ).then(() => {
        woodReady = woodPatterns.some(Boolean);
      });
    }

    function drawWheel() {
      const { cssSize, r } = ensureSquareCanvasToWrapper();
      const cx = r;
      const cy = r;

      ctx.save();
      try {
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, cssSize, cssSize);

        const vs = visibleSongs();
        const rimWidth = r * 0.035;
        positionPointer(rimWidth);

        if (!vs.length) return;

        const arc = (2 * Math.PI) / vs.length;
        const woodRadius = r; // must reach rim
        const texturesAvailable = woodReady && woodPatterns.some(Boolean);

        // --- outer rim (raised bevel) ---
        const rimGrad = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
        rimGrad.addColorStop(0, 'rgba(255,255,255,0.0)');
        rimGrad.addColorStop(0.6, 'rgba(255,255,255,0.35)');
        rimGrad.addColorStop(0.85, 'rgba(255,255,255,0.65)');
        rimGrad.addColorStop(1, 'rgba(255,255,255,0.9)');

        for (let i = 0; i < vs.length; i++) {
          const s = vs[i];
          const a = i * arc + rotation;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, woodRadius, a, a + arc);
          ctx.closePath();

          const pat = texturesAvailable ? (woodPatterns[i % woodPatterns.length] || woodPatterns.find(Boolean)) : null;
          const texCfg = woodTextures[i % woodTextures.length];

          if (pat) {
            ctx.save();
            ctx.clip();

            ctx.translate(cx, cy);
            ctx.rotate(a + (texCfg?.rotate || 0));
            ctx.scale(1, 1);

            ctx.fillStyle = pat;
            ctx.fillRect(-woodRadius, -woodRadius, woodRadius * 2, woodRadius * 2);

            ctx.restore();
          } else {
            ctx.fillStyle = '#8b5a2b';
            ctx.fill();
          }

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(a + arc / 2);

          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';

          const fontSize = Math.max(12, r * 0.05);
          ctx.font = `900 ${fontSize}px system-ui, sans-serif`;

          const rimPadding = rimWidth * 1.2;
          const textRadius = woodRadius - rimPadding;

          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillText(s.display, textRadius, 1.5);
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillText(s.display, textRadius, 0);

          ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r + rimWidth * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = rimGrad;
        ctx.lineWidth = rimWidth;
        ctx.stroke();
        ctx.restore();

        const bezelOuter = r + rimWidth * 0.9;
        const bezelInner = r + rimWidth * 0.25;
        const bezelGrad = ctx.createRadialGradient(cx, cy, bezelInner, cx, cy, bezelOuter);
        bezelGrad.addColorStop(0, 'rgba(255,255,255,0.65)');
        bezelGrad.addColorStop(0.35, 'rgba(230,196,90,0.9)');
        bezelGrad.addColorStop(0.6, 'rgba(176,137,47,0.95)');
        bezelGrad.addColorStop(0.85, 'rgba(122,90,24,0.95)');
        bezelGrad.addColorStop(1, 'rgba(255,255,255,0.35)');

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, (bezelInner + bezelOuter) / 2, 0, Math.PI * 2);
        ctx.strokeStyle = bezelGrad;
        ctx.lineWidth = bezelOuter - bezelInner;
        ctx.stroke();
        ctx.restore();

        const pinRadius = r * 0.012;
        const pinDistance = r - rimWidth * 0.6;

        for (let i = 0; i < vs.length; i++) {
          const ang = i * arc + rotation;
          const px = cx + Math.cos(ang) * pinDistance;
          const py = cy + Math.sin(ang) * pinDistance;

          const pinGrad = ctx.createRadialGradient(
            px - pinRadius * 0.4,
            py - pinRadius * 0.4,
            pinRadius * 0.2,
            px,
            py,
            pinRadius
          );
          pinGrad.addColorStop(0, '#f5e6a6');
          pinGrad.addColorStop(0.4, '#e0c36a');
          pinGrad.addColorStop(0.75, '#b0892f');
          pinGrad.addColorStop(1, '#6b4f18');

          ctx.beginPath();
          ctx.arc(px, py, pinRadius, 0, Math.PI * 2);
          ctx.fillStyle = pinGrad;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(px - pinRadius * 0.25, py - pinRadius * 0.25, pinRadius * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fill();
        }

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        ctx.translate(-cx, -cy);

        const mahoganyIdx = woodTextures.findIndex(w => w.name === 'mahogany');
        const mahoganyPat = (mahoganyIdx >= 0 ? woodPatterns[mahoganyIdx] : null) || woodPatterns.find(Boolean);

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.075, 0, Math.PI * 2);
        ctx.fillStyle = mahoganyPat || '#4a2a1a';
        ctx.fill();

        ctx.strokeStyle = 'rgba(0,0,0,0.30)';
        ctx.lineWidth = r * 0.004;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.042, 0, Math.PI * 2);
        const hubGrad = ctx.createRadialGradient(
          cx - r * 0.01,
          cy - r * 0.01,
          r * 0.006,
          cx,
          cy,
          r * 0.05
        );
        hubGrad.addColorStop(0, '#ead9a0');
        hubGrad.addColorStop(0.4, '#d2b55f');
        hubGrad.addColorStop(0.75, '#a97f2a');
        hubGrad.addColorStop(1, '#6b4f18');
        ctx.fillStyle = hubGrad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx - r * 0.012, cy - r * 0.012, r * 0.008, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.fill();

        ctx.restore();
      } finally {
        ctx.restore();
      }
    }

    function pickIndexForRotation(len) {
      return Math.floor(((2 * Math.PI - (rotation + Math.PI / 2)) % (2 * Math.PI)) / ((2 * Math.PI) / len));
    }

    function pointerFlex(omegaRadPerSec) {
      if (!pointerEl) return;
      const kickDeg = Math.max(3, Math.min(10, omegaRadPerSec * 0.6));
      pointerEl.style.transform = `translateX(-50%) rotate(${kickDeg}deg)`;
      setTimeout(() => {
        pointerEl.style.transform = 'translateX(-50%) rotate(0deg)';
      }, 50);
    }

    function playClick() {
      try {
        clickAudio.currentTime = 0;
        clickAudio.play();
      } catch (e) {}
    }

    function spin() {
      lastClickIndex = null;
      const vsNow = visibleSongs();
      if (spinning || vsNow.length === 0) return;

      spinning = true;
      overlay.style.display = 'none';

      const start = performance.now();
      let omega = (5 + Math.random() * 1.5) * Math.PI;
      const baseFriction = 0.965;
      const friction = baseFriction + (Math.random() - 0.5) * 0.002;
      let lastTime = start;

      (function anim(t) {
        const dt = Math.min((t - lastTime) / 1000, 0.05);
        lastTime = t;

        rotation += omega * dt;
        omega *= Math.pow(friction, dt * 60);

        const idxNow = pickIndexForRotation(vsNow.length);
        if (idxNow !== lastClickIndex) {
          lastClickIndex = idxNow;
          pointerFlex(omega);
          playClick();
        }

        drawWheel();

        if (omega > 0.15) {
          requestAnimationFrame(anim);
        } else {
          const arc = (2 * Math.PI) / vsNow.length;
          const snappedIndex = pickIndexForRotation(vsNow.length);
          rotation = -Math.PI / 2 - arc * snappedIndex - arc / 2;

          drawWheel();
          spinning = false;

          const vs = visibleSongs();
          if (!vs.length) return;

          const idx = pickIndexForRotation(vs.length);
          const picked = vs[(idx + vs.length) % vs.length];

          lastSpunId = picked.id;
          overlayText.textContent = picked.display;
          overlay.style.display = 'flex';

          try {
            winAudio.currentTime = 0;
            winAudio.play();
          } catch (e) {}

          const card = document.getElementById('overlayCard');
          if (card) {
            const tilt = (Math.random() - 0.5) * 6;
            card.style.transform = `scale(1) rotate(${tilt}deg)`;
          }
        }
      })(start);
    }

    function rebuildChecklist() {
      songChecklist.innerHTML = '';
      songs.forEach(s => {
        const l = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = songVisibility[s.id] !== false;
        cb.onchange = () => {
          songVisibility[s.id] = cb.checked;
          overlay.style.display = 'none';
          drawWheel();
        };
        l.appendChild(cb);

        // Full detail for toggle list: title + key (if present) + artist
        const parts = [];
        if (s.title) parts.push(s.title);
        if (s.key) parts.push(`(${s.key})`);
        if (s.artist) parts.push(`– ${s.artist}`);

        l.appendChild(document.createTextNode(parts.join(' ')));
        songChecklist.appendChild(l);
      });
    }

    function initRotationOnce() {
      if (didInitRotation) return;
      const vs = visibleSongs();
      if (!vs.length) return;
      const arc = (2 * Math.PI) / vs.length;
      rotation = -Math.PI / 2 - arc / 2;
      didInitRotation = true;
    }

    // UI
    document.getElementById('wheelNarrowBtn').onclick = () => {
      wheelScaleX = Math.max(0.85, +(wheelScaleX - 0.02).toFixed(3));
      canvas.style.transform = `scaleX(${wheelScaleX})`;
    };

    document.getElementById('wheelWideBtn').onclick = () => {
      wheelScaleX = Math.min(1.15, +(wheelScaleX + 0.02).toFixed(3));
      canvas.style.transform = `scaleX(${wheelScaleX})`;
    };

    document.getElementById('wheelResetBtn').onclick = () => {
      wheelScaleX = 1.0;
      canvas.style.transform = 'scaleX(1)';
    };

    // Spin by clicking anywhere on the wheel
    document.getElementById('wheelWrap').onclick = (e) => {
      // prevent accidental spins when clicking controls layered above
      if (spinning) return;
      spin();
    };
    document.getElementById('toggleListBtn').onclick = () => { listOverlay.style.display = 'flex'; };
    document.getElementById('closeListBtn').onclick = () => { listOverlay.style.display = 'none'; };

    document.getElementById('selectAllBtn').onclick = () => {
      songs.forEach(s => { songVisibility[s.id] = true; });
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    document.getElementById('selectNoneBtn').onclick = () => {
      songs.forEach(s => { songVisibility[s.id] = false; });
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    document.getElementById('deselectLastBtn').onclick = () => {
      if (!lastSpunId) return;
      songVisibility[lastSpunId] = false;
      overlay.style.display = 'none';
      rebuildChecklist();
      drawWheel();
    };

    document.getElementById('lyricsBtn').onclick = () => {
      if (!lastSpunId) return;
      const s = songs.find(x => x.id === lastSpunId);
      if (!s || !s.lyricsUrl) return;
      window.open(s.lyricsUrl, '_blank', 'noopener');
    };

    document.getElementById('spotifyBtn').onclick = () => {
      if (!lastSpunId) return;
      const s = songs.find(x => x.id === lastSpunId);
      if (!s) return;

      const query = encodeURIComponent([s.title, s.artist].filter(Boolean).join(' '));
      const url = `https://open.spotify.com/search/${query}`;
      window.open(url, '_blank', 'noopener');
    };

    async function loadSongs() {
      const url = 'https://docs.google.com/spreadsheets/d/16piXDxJk6q6Il0mPR4phsyfXML6CkWyJyS7LGEM_Zaw/gviz/tq?tqx=out:csv&sheet=Songs';
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Failed to load sheet CSV (HTTP ${res.status})`);

      const csv = await res.text();
      const rows = parseCSV(csv);
      if (rows.length === 0) return;

      const headers = rows[0].map(h => h.trim());
      const songIdx = headers.findIndex(h => /song/i.test(h));
      const keyIdx = headers.findIndex(h => /key/i.test(h));
      const incIdx = headers.findIndex(h => /include/i.test(h));
      const linkIdx = headers.findIndex(h => /lyrics\s*url/i.test(h));
      if (songIdx < 0) throw new Error('Could not find a Song column in the sheet');

      const temp = [];
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i];
        const meta = parseSongCell(cols[songIdx]);
        if (!meta) continue;
        const id = `${meta.title}__${meta.artist}__${i}`;
        const incRaw = incIdx >= 0 ? cols[incIdx] : 'TRUE';
        const lyricsUrl = linkIdx >= 0 ? cols[linkIdx] : '';
        const key = keyIdx >= 0 ? cols[keyIdx] : '';
        temp.push({ id, ...meta, key, lyricsUrl, include: includeToChecked(incRaw) });
      }

      const titleCounts = {};
      temp.forEach(s => { titleCounts[s.title] = (titleCounts[s.title] || 0) + 1; });

      songs = [];
      songVisibility = {};

      temp.forEach(s => {
        const ambiguous = titleCounts[s.title] > 1;
        const display = ambiguous && s.artist ? `${s.title} – ${s.artist}` : s.title;
        songs.push({ id: s.id, title: s.title, artist: s.artist, display, lyricsUrl: s.lyricsUrl, key: s.key });
        songVisibility[s.id] = s.include;
      });

      rebuildChecklist();
      initRotationOnce();
      drawWheel();
    }

    // --- Tests (run in console) ---
    function runTests() {
      const saved = {
        songs: songs.slice(),
        songVisibility: { ...songVisibility },
        rotation,
        didInitRotation,
        lastSpunId,
        woodReady,
        wheelScaleX
      };

      const assert = (cond, msg) => { if (!cond) throw new Error(`Test failed: ${msg}`); };

      try {
        const el = document.getElementById('buildStamp');
        assert(!!el, 'buildStamp element exists');
        assert(typeof el.textContent === 'string' && el.textContent.trim().length > 0, 'buildStamp text is not empty');
        assert(/^Updated\s+/.test(el.textContent), 'buildStamp starts with "Updated"');

        assert(Array.isArray(woodTextures) && woodTextures.length >= 3, 'woodTextures is defined');
        assert(Array.isArray(woodPatterns) && woodPatterns.length === woodTextures.length, 'woodPatterns index aligns with woodTextures');

        const p1 = parseSongCell('Fix You - Coldplay');
        assert(p1 && p1.title === 'Fix You' && p1.artist === 'Coldplay', 'parseSongCell splits Title - Artist');
        const p2 = parseSongCell('Fix You - in E♭ - Coldplay');
        assert(p2 && p2.title === 'Fix You' && p2.artist === 'in E♭ - Coldplay', 'parseSongCell preserves extra dash parts in artist');

        const mock = [
          { id: '1', title: 'Yesterday', artist: '', include: true },
          { id: '2', title: 'Fix You', artist: 'Coldplay', include: true },
          { id: '3', title: 'Fix You', artist: 'Acoustic', include: true }
        ];
        const counts = {};
        mock.forEach(s => counts[s.title] = (counts[s.title] || 0) + 1);
        const displayFor = (title, artist) => (counts[title] > 1 && artist ? `${title} – ${artist}` : title);
        assert(displayFor('Yesterday', '') === 'Yesterday', 'Unambiguous title omits artist');
        assert(displayFor('Fix You', 'Coldplay') === 'Fix You – Coldplay', 'Ambiguous title includes artist');

        assert(includeToChecked('TRUE') === true, 'Include TRUE => checked');
        assert(includeToChecked('FALSE') === false, 'Include FALSE => unchecked');
        assert(includeToChecked('no') === false, 'Include no => unchecked');
        assert(includeToChecked('0') === false, 'Include 0 => unchecked');

        const rows = parseCSV('Song,Include\n"Hello, World - Someone",TRUE\n');
        assert(rows.length === 2 && rows[1][0] === 'Hello, World - Someone', 'parseCSV handles commas inside quotes');

        rotation = 0;
        assert(typeof pickIndexForRotation(10) === 'number', 'pickIndexForRotation returns a number');

        assert(!!pointerEl, 'pointer element exists');
        const { r } = ensureSquareCanvasToWrapper();
        positionPointer(r * 0.035);
        assert(/px$/.test(pointerEl.style.top), 'pointer top is set in px');

        assert(!!document.getElementById('wheelNarrowBtn'), 'wheelNarrowBtn exists');
        assert(!!document.getElementById('wheelWideBtn'), 'wheelWideBtn exists');
        assert(!!document.getElementById('lyricsBtn'), 'lyricsBtn exists');

        wheelScaleX = 1;
        for (let i = 0; i < 50; i++) wheelScaleX = Math.max(0.85, +(wheelScaleX - 0.02).toFixed(3));
        assert(wheelScaleX >= 0.85, 'wheelScaleX lower bound');
        for (let i = 0; i < 50; i++) wheelScaleX = Math.min(1.15, +(wheelScaleX + 0.02).toFixed(3));
        assert(wheelScaleX <= 1.15, 'wheelScaleX upper bound');

        // New tests: toggle list renders full detail text.
        songs = [
          { id: 't1', title: 'Song A', key: 'G', artist: 'Artist A', display: 'Song A', lyricsUrl: 'https://example.com' },
          { id: 't2', title: 'Song B', key: '', artist: 'Artist B', display: 'Song B', lyricsUrl: '' }
        ];
        songVisibility = { t1: true, t2: true };
        rebuildChecklist();
        const labels = songChecklist.querySelectorAll('label');
        assert(labels.length === 2, 'rebuildChecklist created 2 labels');
        assert(labels[0].textContent.includes('Song A') && labels[0].textContent.includes('(G)') && labels[0].textContent.includes('Artist A'), 'toggle list shows title + key + artist');
        assert(labels[1].textContent.includes('Song B') && !labels[1].textContent.includes('(G)'), 'toggle list omits key if blank');

        didInitRotation = false;
        initRotationOnce();
        assert(didInitRotation === true, 'initRotationOnce sets flag');

        console.info('Song Spinner tests: OK');
      } finally {
        songs = saved.songs;
        songVisibility = saved.songVisibility;
        rotation = saved.rotation;
        didInitRotation = saved.didInitRotation;
        lastSpunId = saved.lastSpunId;
        woodReady = saved.woodReady;
        wheelScaleX = saved.wheelScaleX;
      }
    }

    // Boot
    loadWoodTextures().then(() => drawWheel());
    loadSongs().catch(err => {
      console.error(err);
      drawWheel();
    });

    window.addEventListener('resize', () => {
      overlay.style.display = 'none';
      drawWheel();
    });

    runTests();
  </script>
</body>
</html>
